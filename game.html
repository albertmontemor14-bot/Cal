<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculus Adventure: The Math Kingdom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B0%3C/text%3E%3C/svg%3E">
<meta name="description" content="Calculus Adventure: The Math Kingdom, a pixel adventure game made with HTML, CSS and JavaScript.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
  <!-- background layers, back to front -->
  <div class="layer sky"></div>
  <div class="layer stars"></div>
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="layer scenery mountains"></div>
  <div class="layer scenery hills"></div>
  <div class="layer scenery trees"></div>
  <div class="layer under"></div>

  <!-- the game itself goes here -->
  <div id="world"></div>

  <div class="hud">
    <div class="hearts" id="hearts" role="img"></div>
    <div class="actions">
      <a class="btn" href="index.html">Home</a>
      <button class="btn" id="mode">Day / Night</button>
      <button class="btn" id="sound">Sound: On</button>
    </div>
  </div>
  <div class="help">A / D or arrows: move<br>W or space: jump<br>J or click: sword</div>

  <div class="pad">
    <div class="grp">
      <button class="btn" data-act="left" aria-label="Move left">&#9664;</button>
      <button class="btn" data-act="right" aria-label="Move right">&#9654;</button>
    </div>
    <div class="grp">
      <button class="btn" data-act="jump">Jump</button>
      <button class="btn" data-act="attack">Sword</button>
    </div>
  </div>

  <div id="over">
    <h2>You fainted!</h2>
    <p>The slimes won this time.</p>
    <button class="btn" id="again">Try again</button>
  </div>

<script>
document.getElementById("mode").addEventListener("click", function () {
  var root = document.documentElement;
  var dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
});
</script>
<script src="js/music.js"></script>
<script src="js/sound.js"></script>
<script src="js/game.js"></script>
</body>
</html>
